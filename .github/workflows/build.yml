name: Build RootHide package

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - bootstrap
    paths:
      - "src/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: roothide-package-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build RootHide deb
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos dependencies
        run: brew install ldid make xz

      - name: Install RootHide Theos and required SDK
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -f "$THEOS/makefiles/common.mk"
          "$THEOS/bin/install-sdk" iPhoneOS14.5
          test -d "$THEOS/sdks/iPhoneOS14.5.sdk"

      - name: Build RootHide package
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -C src clean
          make -C src package FINALPACKAGE=1
          find src/packages -type f -name "*.deb" -print
          test -n "$(find src/packages -type f -name "*.deb" -print -quit)"

      - name: Upload RootHide deb
        uses: actions/upload-artifact@v4
        with:
          name: CocoaTop-RootHide
          path: src/packages/*.deb
          if-no-files-found: error
          retention-days: 14
